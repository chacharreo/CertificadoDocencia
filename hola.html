<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boton Rojo en el Centro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .centro {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }
        .boton-rojo {
            background-color: red;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="centro">
        <span>¡Hola! Aquí está el botón rojo en el centro.</span>
    </div>
    <button class="boton-rojo">Botón Rojo</button>
</body>
</html>
